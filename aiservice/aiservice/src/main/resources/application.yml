spring:
  application:
  name: aiservice

  kafka:
    bootstrap-servers: localhost:9092 # this is the kafka port which we run
    consumer:
      group-id: activity-processor-group
      key-deserializers: org.apache.kafka.common.serialization.StringDeSerializer
      value-deserializers: org.springframework.kafka.support.serializer.JsonDeSerializer
      properties:
        spring.json.use.type.headers: false #com.activity is the type , we dont want that
        spring.json.value.default.type: package com.nitin.aiservice.model.Activity # map the json object to this class
        spring.json.trusted.packages: "*"
      # kafka stores and sends json objects not http requests , those json objects contain http body



data:
  mongodb:
    uri: mongodb://localhost:27017/airecommendationfitness
    database: airecommendationfitness

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8083


